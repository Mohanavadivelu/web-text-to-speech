name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -m "not slow"

  engine:
    name: Speech engine (model tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Cache model files
        uses: actions/cache@v4
        with:
          path: models
          # The model files are pinned in model_store.py, so its hash identifies them
          key: kokoro-models-${{ hashFiles('server/engine/model_store.py') }}
      - run: python -m server.engine.model_store download
      - run: pytest -m slow
        env:
          REQUIRE_MODELS: '1'

  web:
    name: Web (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: false
          tags: kokoro-tts-web:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Health check
        run: |
          docker run -d --name api -p 8000:8000 kokoro-tts-web:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8000/v1/health && exit 0
            sleep 1
          done
          docker logs api
          exit 1
