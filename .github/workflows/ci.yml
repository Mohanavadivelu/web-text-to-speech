name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -m "not slow"

  engine:
    name: Speech engine (model tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Cache model files
        uses: actions/cache@v4
        with:
          path: models
          # The model files are pinned in model_store.py, so its hash identifies them
          key: kokoro-models-${{ hashFiles('server/engine/model_store.py') }}
      - run: python -m server.engine.model_store download
      - run: pytest -m slow
        env:
          REQUIRE_MODELS: '1'

  web:
    name: Web (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  stack:
    name: Docker stack (end-to-end job)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build the image (dependencies and model built in)
        run: docker compose -f server/docker-compose.yml build
      - name: Start Redis, storage, API and worker
        run: |
          docker compose -f server/docker-compose.yml up -d
          for i in $(seq 1 60); do
            docker compose -f server/docker-compose.yml logs worker | grep -q " ready" && break
            sleep 2
          done
          curl -fsS http://localhost:8000/v1/health
      - name: Run a job and download its MP3
        run: |
          pip install arq==0.28.0 redis==5.3.1 boto3==1.43.109 numpy==2.4.6 soundfile==0.14.0 pydantic-settings==2.15.0
          python scripts/try_job.py "Continuous integration says hello."
          python scripts/try_job.py --long --cancel-after 3
      - name: Logs
        if: failure()
        run: docker compose -f server/docker-compose.yml logs
