name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint + tests)
    runs-on: ubuntu-latest
    services:
      postgres: # for the database and row-level-security tests (server/tests/db)
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -m "not slow"
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - name: OpenAPI schema is up to date
        run: |
          python scripts/export_openapi.py
          git diff --exit-code web/src/api/openapi.json

  engine:
    name: Speech engine (model tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Cache model files
        uses: actions/cache@v4
        with:
          path: models
          # The model files are pinned in model_store.py, so its hash identifies them
          key: kokoro-models-${{ hashFiles('server/engines/kokoro/model_store.py') }}
      - run: python -m server.engines.kokoro.model_store download
      - run: pytest -m slow
        env:
          REQUIRE_MODELS: '1'

  web:
    name: Web (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - name: API types are up to date
        run: |
          npm run api:types
          git diff --exit-code src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  stack:
    name: Docker stack (end-to-end jobs and browser tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Start local Supabase (auth, database, mail inbox)
        run: npx --yes supabase@latest start -x imgproxy,storage-api,edge-runtime,logflare,vector,realtime,supavisor,studio,postgres-meta
      - name: Build the image (dependencies and model built in)
        run: docker compose -f server/docker-compose.yml build
      - name: Start Redis, storage, API and both workers
        run: |
          docker compose -f server/docker-compose.yml up -d
          for i in $(seq 1 90); do
            [ "$(docker compose -f server/docker-compose.yml logs | grep -c ' ready on queue')" -ge 2 ] && break
            sleep 2
          done
          curl -fsS http://localhost:8000/v1/health
      - name: Run jobs through the API and download the MP3
        run: |
          pip install websockets==17.2 numpy==2.4.6 soundfile==0.14.0
          python scripts/try_job.py "Continuous integration says hello."
          python scripts/try_job.py "Continuous integration says hello."   # served from cache
          python scripts/try_job.py --long --cancel-after 3
      - name: Browser tests (Playwright, desktop and phone)
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e
        env:
          CI: '1'
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
      - name: Logs
        if: failure()
        run: docker compose -f server/docker-compose.yml logs
