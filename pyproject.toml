[project]
name = "narravo"
version = "0.0.0"
description = "Text-to-speech web service built on Kokoro-82M"
requires-python = ">=3.11,<3.13"   # misaki and spaCy don't support 3.13 yet; production uses 3.12

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["web"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # import sorting
  "B",        # bugbear
  "UP",       # pyupgrade
  "SIM",      # simplify
  "S",        # bandit (security)
  "T20",      # no print()
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]   # FastAPI's dependency injection pattern

[tool.ruff.lint.per-file-ignores]
"server/tests/**" = ["S101", "S105", "S106"]   # asserts and dummy passwords are fine in tests
"scripts/**" = ["T20"]         # scripts may print

[tool.pytest.ini_options]
testpaths = ["server/tests"]
addopts = "-ra --strict-markers"
markers = [
  "slow: needs the speech model (deselect with -m 'not slow')",
  "db: needs a Postgres server (TEST_DATABASE_URL)",
]
filterwarnings = [
  # misaki (third-party) still uses importlib.resources.open_text
  "ignore:open_text is deprecated:DeprecationWarning:misaki",
]
