# Local development stack: Redis, S3-compatible storage (SeaweedFS stands in for R2),
# the API and two speech workers: one for short texts, one for long ones, so a
# one-sentence request never waits behind a book chapter.
#
#   docker compose -f server/docker-compose.yml up --build
#
# The containers read ../.env, but the storage, Redis and Supabase settings below
# override it, so local development never touches the real R2 bucket or the hosted
# Supabase project. Supabase runs separately through its CLI (see README):
#   npx supabase start -x imgproxy,storage-api,edge-runtime,logflare,vector,realtime,supavisor

x-app: &app
  build:
    context: ..
    dockerfile: server/Dockerfile
  image: narravo:dev
  env_file:
    - path: ../.env
      required: false
  environment: &app-env
    REDIS_URL: redis://redis:6379/0
    R2_ENDPOINT_URL: http://seaweedfs:8333
    R2_PUBLIC_ENDPOINT_URL: http://localhost:8333
    R2_ACCESS_KEY_ID: dev-access-key
    R2_SECRET_ACCESS_KEY: dev-secret-key
    R2_BUCKET: kokoro-tts-audio
    RATE_LIMIT_PER_MINUTE: '600' # development only: lets the benchmark send many jobs
    ENGINE_SPIN: '0' # two workers share the CPU: don't busy-wait (see engine/synth.py)
    # Local Supabase (CLI): its fixed public development values. The API needs no
    # Supabase secret key: it checks tokens with public keys and uses DATABASE_URL.
    SUPABASE_URL: http://host.docker.internal:54321
    SUPABASE_JWT_ISSUER: http://127.0.0.1:54321/auth/v1 # what tokens say; the browser's address
    SUPABASE_PUBLISHABLE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
    DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
    # Cloudflare's always-pass Turnstile test secret, so the bot check runs in development
    TURNSTILE_SECRET_KEY: '${TURNSTILE_SECRET_KEY:-1x0000000000000000000000000000000AA}'
  volumes:
    - ../server:/app/server:ro # code changes apply on restart, no rebuild needed
  extra_hosts:
    - host.docker.internal:host-gateway # reach local Supabase on Linux too (CI)
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy
    seaweedfs:
      condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs
    command: ['server', '-s3', '-s3.config=/etc/seaweedfs/s3.json', '-dir=/data']
    ports: ['8333:8333']
    volumes:
      - ./dev/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
      - seaweedfs-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 8333'] # not 'localhost': that's IPv6 here
      interval: 3s
      start_period: 120s # the first start on a fresh volume can take a minute or more
      retries: 20

  api:
    <<: *app
    command: ['uvicorn', 'server.api.main:app', '--host', '0.0.0.0', '--port', '8000', '--reload']
    ports: ['8000:8000']

  worker-short:
    <<: *app
    command: ['arq', 'server.worker.main.WorkerSettings']
    environment:
      <<: *app-env
      WORKER_QUEUE: tts:short
      # Threads per worker (0 = all). On a small server, split the CPU between them.
      ENGINE_THREADS: '${ENGINE_THREADS_SHORT:-0}'
    deploy:
      resources:
        limits:
          memory: 2g

  worker-long:
    <<: *app
    # Lower CPU priority: when both workers are busy, short jobs get the CPU first
    command: ['nice', '-n', '10', 'arq', 'server.worker.main.WorkerSettings']
    environment:
      <<: *app-env
      WORKER_QUEUE: tts:long
      ENGINE_THREADS: '${ENGINE_THREADS_LONG:-0}'
    deploy:
      resources:
        limits:
          memory: 2g

volumes:
  redis-data:
  seaweedfs-data:
